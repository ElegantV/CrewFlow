services:
  api:
    build:
      context: .
      args:
        APK_MIRROR: ${APK_MIRROR:-https://mirrors.aliyun.com}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crewflow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crewflow}
    depends_on:
      db:
        condition: service_healthy
    # 只绑定回环,由 Caddy 本机反代,防止绕过 HTTPS 网关直连裸 HTTP。
    # 若改为容器化 Caddy(经 host.docker.internal 访问),需改绑 docker 网桥地址。
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crewflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crewflow}
    volumes:
      - crewflow_postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432" # 仅本机回环,供 SSH 隧道连 DBeaver,不暴露公网
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crewflow} -d ${POSTGRES_DB:-crewflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crewflow_postgres:
